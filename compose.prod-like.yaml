# Production-like variant. Run via scripts/prod-like.sh; do not run together with compose.yaml
# (same loopback ports). TLS edge proxy, file-based JWT secrets, no synthetic seed,
# hardened app container. This remains a local assessment, not a production identity service.
name: fraud-rule-engine-prod-like

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_signing_key:
    file: ./secrets/jwt_signing_key
  jwt_bootstrap_token:
    file: ./secrets/jwt_bootstrap_token
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  app_datasource_password:
    file: ./secrets/postgres_password

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: fraud_rule_engine
      POSTGRES_USER: fraud_rule_engine
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [backend]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_rule_engine -d fraud_rule_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [backend]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-rule-engine:prod-like
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_rule_engine
      SPRING_DATASOURCE_USERNAME: fraud_rule_engine
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUD_SECURITY_LOCAL_AUTH_ENABLED: "true"
      FRAUD_SECURITY_LOCAL_AUTH_ISSUER: https://api.localhost:${EDGE_PORT:-8443}
      FRAUD_SECURITY_LOCAL_AUTH_AUDIENCE: fraud-rule-engine-api
      FRAUD_DOCS_ENABLED: "false"
      FRAUD_SECURITY_METRICS_ALLOWED_CIDR: ${PRODLIKE_PROMETHEUS_IP:-172.31.0.10}/32
    secrets:
      - source: app_datasource_password
        target: spring.datasource.password
      - source: jwt_signing_key
        target: fraud.security.local-auth.signing-key-base64
      - source: jwt_bootstrap_token
        target: fraud.security.local-auth.bootstrap-token
    networks: [backend, edge, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: fraud-rule-engine-web/Dockerfile
    image: fraud-rule-engine-web:prod-like
    volumes:
      - ./docker/web/local-app-config.json:/srv/app-config.json:ro
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    restart: unless-stopped

  edge:
    image: caddy:2.10.2-alpine
    volumes:
      - ./docker/prod-like/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "127.0.0.1:${EDGE_PORT:-8443}:8443"
    networks:
      edge:
        aliases: [api.localhost]
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      monitoring:
        ipv4_address: ${PRODLIKE_PROMETHEUS_IP:-172.31.0.10}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [monitoring]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  postgres-data:
    name: fraud-rule-engine-prod-like-postgres-data
  kafka-data:
    name: fraud-rule-engine-prod-like-kafka-data
  caddy-data:
    name: fraud-rule-engine-prod-like-caddy-data
  prometheus-data:
    name: fraud-rule-engine-prod-like-prometheus-data
  grafana-data:
    name: fraud-rule-engine-prod-like-grafana-data

networks:
  backend:
    name: fraud-rule-engine-prod-like-backend
    internal: true
  edge:
    name: fraud-rule-engine-prod-like-edge
  monitoring:
    name: fraud-rule-engine-prod-like-monitoring
    ipam:
      config:
        - subnet: ${PRODLIKE_SUBNET:-172.31.0.0/24}
